# Layered on information.market.yaml and information.news.yaml: raw plus disclosures.
# disclosure-http reads filings published before the decision date and calls the disclosure
# embedding and reranking models, so it also joins egress. The model identity settings match
# compose.prod.yaml so queries land in the same embedding space as the index.
x-disclosure-model-environment: &disclosure-model-environment
  DISCLOSURE_EMBEDDING_BASE_REPO: ${DISCLOSURE_EMBEDDING_BASE_REPO:-perplexity-ai/pplx-embed-v2-context-9b-preview}
  DISCLOSURE_EMBEDDING_BASE_REVISION: ${DISCLOSURE_EMBEDDING_BASE_REVISION:-e2c06a779d45e8db53066735be1b98ffe3412ca3}
  DISCLOSURE_EMBEDDING_ADAPTER_REPO: ${DISCLOSURE_EMBEDDING_ADAPTER_REPO:-Dongju-00/stockspoon-pplx-embed-v2-context-9b}
  DISCLOSURE_EMBEDDING_ADAPTER_REVISION: ${DISCLOSURE_EMBEDDING_ADAPTER_REVISION:-6949b167a2cf9caa92a2e765814a1db008a7bc7e}
  DISCLOSURE_EMBEDDING_ADAPTER_SHA256: ${DISCLOSURE_EMBEDDING_ADAPTER_SHA256:-1f5d43671826dab233cc32942cedb31bd0f8564f42a4b8f359a4a100d66c60e2}
  DISCLOSURE_RERANKER_BASE_REPO: ${DISCLOSURE_RERANKER_BASE_REPO:-Qwen/Qwen3-Reranker-4B}
  DISCLOSURE_RERANKER_BASE_REVISION: ${DISCLOSURE_RERANKER_BASE_REVISION:-22e683669bc0f0bd69640a1354a6d0aebcfeede5}
  DISCLOSURE_RERANKER_ADAPTER_REPO: ${DISCLOSURE_RERANKER_ADAPTER_REPO:-Dongju-00/stockspoon-qwen3-reranker-4b-lora}
  DISCLOSURE_RERANKER_ADAPTER_REVISION: ${DISCLOSURE_RERANKER_ADAPTER_REVISION:-8cfbbb0c1ca7502bcd4eeb549f1bb9f20ee643dd}
  DISCLOSURE_RERANKER_ADAPTER_SHA256: ${DISCLOSURE_RERANKER_ADAPTER_SHA256:-7d43c402f5061930e5e9fbc6e8c9e7618662814181f50a8c1b7a48371f947d24}

services:
  disclosure-http-pit:
    image: ktb4-evaluation/disclosure-http:local
    build:
      context: .
      dockerfile: docker/disclosure-http.Dockerfile
    command: ["disclosure-http-evaluation"]
    environment:
      <<: *disclosure-model-environment
      DISCLOSURE_HTTP_POSTGRES_DSN: ${EVALUATION_POSTGRES_DSN:?EVALUATION_POSTGRES_DSN must be set}
      DISCLOSURE_HTTP_EVALUATION_CLOCK_FILE: /clock/as_of
      DISCLOSURE_HTTP_PUBLIC_URL: http://disclosure-http-pit:8000
      DISCLOSURE_HTTP_LOG_LEVEL: ${EVALUATION_LOG_LEVEL:-INFO}
      DISCLOSURE_INFERENCE_BACKEND: ${DISCLOSURE_INFERENCE_BACKEND:-modal}
      DISCLOSURE_MODAL_KEY: ${DISCLOSURE_MODAL_KEY:-}
      DISCLOSURE_MODAL_SECRET: ${DISCLOSURE_MODAL_SECRET:-}
      DISCLOSURE_MODAL_QUERY_URL: ${DISCLOSURE_MODAL_QUERY_URL:-}
      DISCLOSURE_MODAL_RERANK_URL: ${DISCLOSURE_MODAL_RERANK_URL:-}
      DISCLOSURE_EMBEDDING_BASE_URI: ${DISCLOSURE_EMBEDDING_BASE_URI:-}
      DISCLOSURE_EMBEDDING_API_KEY: ${DISCLOSURE_EMBEDDING_API_KEY:-}
      DISCLOSURE_EMBEDDING_MODEL: ${DISCLOSURE_EMBEDDING_MODEL:-}
      DISCLOSURE_EMBEDDING_DIMENSIONS: ${DISCLOSURE_EMBEDDING_DIMENSIONS:-1024}
      DISCLOSURE_EMBEDDING_MAX_TOKENS: ${DISCLOSURE_EMBEDDING_MAX_TOKENS:-16384}
      DISCLOSURE_EMBEDDING_QUERY_INSTRUCTION: ${DISCLOSURE_EMBEDDING_QUERY_INSTRUCTION:-}
      DISCLOSURE_RETRIEVAL_TIMEOUT: ${DISCLOSURE_RETRIEVAL_TIMEOUT:-150}
      DISCLOSURE_RETRIEVAL_MAX_DISTANCE: ${DISCLOSURE_RETRIEVAL_MAX_DISTANCE:-}
    volumes:
      - clock:/clock:ro
    networks: [dataset, information, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  runner:
    environment:
      HARNESS_INFORMATION_VARIANT: disclosures
      HARNESS_DISCLOSURES_URL: http://disclosure-http-pit:8000
    depends_on:
      disclosure-http-pit:
        condition: service_healthy

networks:
  egress: {}
