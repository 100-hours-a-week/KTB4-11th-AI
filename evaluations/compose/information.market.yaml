services:
  market-http-pit:
    image: ktb4-evaluation/market-http:local
    build:
      context: .
      dockerfile: docker/market-http.Dockerfile
    command: ["market-http-evaluation"]
    environment:
      MARKET_HTTP_QUESTDB_CONF: ${EVALUATION_QUESTDB_CONF:-ws::addr=questdb:9000;connect_timeout=5000;}
      MARKET_HTTP_EVALUATION_ACCESS: pit
      MARKET_HTTP_EVALUATION_CLOCK_FILE: /clock/as_of
      MARKET_HTTP_LOG_LEVEL: ${EVALUATION_LOG_LEVEL:-INFO}
      OTEL_SDK_DISABLED: "true"
    volumes:
      - clock:/clock:ro
    networks: [dataset, information]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  runner:
    environment:
      HARNESS_INFORMATION_VARIANT: market
      HARNESS_MARKET_URL: http://market-http-pit:8000
    networks: [harness, information]
    depends_on:
      market-http-pit:
        condition: service_healthy

networks:
  information:
    internal: true
