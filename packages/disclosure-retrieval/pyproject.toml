[project]
name = "disclosure-retrieval"
version = "0.1.0"
description = "Read-only periodic disclosure retrieval library"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ktb-core",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.54",
]

[tool.uv.sources]
ktb-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
