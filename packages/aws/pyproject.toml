[project]
name = "ktb-aws"
version = "0.1.0"
description = "Shared AWS integrations for AI services"
requires-python = ">=3.14,<3.16"
dependencies = []

[project.optional-dependencies]
redis = ["botocore>=1.40", "redis>=6.4"]
sqs = ["boto3>=1.35"]

[tool.deptry.per_rule_ignores]
DEP002 = ["boto3"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
