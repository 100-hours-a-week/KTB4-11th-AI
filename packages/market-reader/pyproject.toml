[project]
name = "ktb-market-reader"
version = "0.1.0"
description = "Read market candles, themes and index membership back out of QuestDB"
requires-python = ">=3.13,<3.15"
dependencies = [
    "psycopg[binary]>=3.3.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
