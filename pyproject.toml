[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "ruff>=0.14",
    "ty==0.0.82",
    "deptry>=0.25.1",
    "tach>=0.35.1",
]
migrations = [
    "alembic>=1.16",
    "psycopg[binary]>=3.3.6",
    "pgvector>=0.5.0",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "infrastructure"]
addopts = "-q --import-mode=importlib"
