name: ktb4-ai

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: ktb
      POSTGRES_PASSWORD: ktb
      POSTGRES_DB: news
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktb -d news"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  questdb:
    image: questdb/questdb:10.0.1
    ports:
      - "8812:8812"
      - "9000:9000"
      - "9003:9003"
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9003/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:8.8.2-trixie
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  news-preprocessor:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/news-preprocessor.Dockerfile
    environment:
      - NEWS_PREPROCESSOR_POSTGRES_DSN=postgresql+psycopg://ktb:ktb@postgres:5432/news
      - NEWS_PREPROCESSOR_EMBED_BATCH_LIMIT=${NEWS_PREPROCESSOR_EMBED_BATCH_LIMIT:-100}
      - NEWS_PREPROCESSOR_LOG_LEVEL=${NEWS_PREPROCESSOR_LOG_LEVEL:-INFO}
      - KTB_EMBEDDING_BASE_URI
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  news-clusterer:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/news-clusterer.Dockerfile
    environment:
      - NEWS_CLUSTERER_POSTGRES_DSN=postgresql+psycopg://ktb:ktb@postgres:5432/news
      - NEWS_CLUSTERER_LLM_BASE_URI
      - NEWS_CLUSTERER_LLM_MODEL
      - NEWS_CLUSTERER_EPS=${NEWS_CLUSTERER_EPS:-0.2}
      - NEWS_CLUSTERER_MIN_SAMPLES=${NEWS_CLUSTERER_MIN_SAMPLES:-3}
      - NEWS_CLUSTERER_LOG_LEVEL=${NEWS_CLUSTERER_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  questdb-data:
