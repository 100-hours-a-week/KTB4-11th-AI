name: ktb4-ai

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ktb
      POSTGRES_PASSWORD: ktb
      POSTGRES_DB: news
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktb -d news"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  questdb:
    image: questdb/questdb:10.0.1
    ports:
      - "8812:8812"
      - "9000:9000"
      - "9003:9003"
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9003/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:8.8.2-trixie
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  questdb-data:
