[project]
name = "competition"
version = "0.1.0"
description = "Competition participant settings intake worker"
requires-python = ">=3.14,<3.16"
dependencies = [
    "ktb-aws",
    "ktb-core",
    "boto3>=1.35",
    "botocore>=1.35",
    "httpx>=0.28",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
competition = "competition.__main__:main"

[tool.uv.sources]
ktb-aws = { workspace = true }
ktb-core = { workspace = true }

[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
