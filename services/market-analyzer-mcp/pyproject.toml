[project]
name = "market-analyzer-mcp"
version = "0.1.0"
description = "MCP server exposing technical indicators and their verdicts for one symbol"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ktb-core",
    "ktb-market-analyzer",
    "mcp>=2.2",
    "numpy>=2.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "starlette>=1.7",
    "uvicorn>=0.54",
]

[project.scripts]
market-analyzer-mcp = "market_analyzer_mcp.__main__:main"

[tool.uv.sources]
ktb-core = { workspace = true }
ktb-market-analyzer = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
