[project]
name = "portfolio-rebalancer"
version = "0.1.0"
description = "Turns model portfolios into buy and sell requests on the Backend"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ktb-core",
    "exchange-calendars>=4.10",
    "httpx>=0.28",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "questdb[dataframe]>=5.0",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
portfolio-rebalancer = "portfolio_rebalancer.__main__:main"

[tool.uv.sources]
ktb-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.deptry.per_rule_ignores]
# psycopg is the driver SQLAlchemy loads from the DSN. It is required at runtime and
# never imported, which is exactly what DEP002 cannot tell apart.
DEP002 = ["psycopg"]
