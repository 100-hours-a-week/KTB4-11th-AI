[project]
name = "disclosure-indexer"
version = "0.1.0"
description = "Section-aware disclosure indexing"
requires-python = ">=3.13,<3.15"
dependencies = ["ktb-core", "sqlalchemy>=2.0.54", "psycopg[binary]>=3.3.6", "pydantic-settings>=2.7", "pydantic>=2.9", "httpx>=0.28"]

[project.scripts]
disclosure-indexer = "disclosure_indexer.__main__:main"

[tool.uv.sources]
ktb-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg"]
