[project]
name = "report-builder"
version = "0.1.0"
description = "Competition report generator"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ktb-core",
    "langchain-core>=1.6.5",
    "langchain-openrouter>=0.2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
report-builder = "report_builder.report:main"

[tool.uv.sources]
ktb-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
