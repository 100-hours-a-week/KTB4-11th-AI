[project]
name = "market-http"
version = "0.1.0"
description = "Public HTTP API for current prices and OHLCV history"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ktb-core",
    "ktb-aws",
    "fastapi>=0.142",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "questdb>=5.0",
    "redis>=6.4",
    "scalar-fastapi>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.54",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-distro==0.66b0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-instrumentation-redis==0.66b0",
    "opentelemetry-instrumentation-psycopg==0.66b0",
    "opentelemetry-instrumentation-requests==0.66b0",
    "opentelemetry-instrumentation-logging==0.66b0",
]

[project.scripts]
market-http = "market_http.__main__:main"

[tool.uv.sources]
ktb-core = { workspace = true }
ktb-aws = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
