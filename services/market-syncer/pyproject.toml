[project]
name = "market-syncer"
version = "0.1.0"
description = "Synchronize Kiwoom and OpenDART reference data for KOSPI corporations and themes"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ktb-core",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.54",
    "psycopg[binary]>=3.3.6",
    "kwcli",
    "opendartreader>=0.3.3",
]

[project.scripts]
market-syncer = "market_syncer.__main__:main"

[tool.uv.sources]
ktb-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
