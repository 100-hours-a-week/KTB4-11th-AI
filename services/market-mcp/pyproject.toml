[project]
name = "market-mcp"
version = "0.1.0"
description = "MCP server reading QuestDB candles through market-analyzer"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ktb-core",
    "ktb-market-analyzer",
    "mcp>=2.2",
    "numpy>=2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.7",
]

[project.scripts]
market-mcp = "market_mcp.__main__:main"

[tool.uv.sources]
ktb-core = { workspace = true }
ktb-market-analyzer = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
