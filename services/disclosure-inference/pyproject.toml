[project]
name = "disclosure-inference"
version = "0.1.0"
description = "Disclosure embedding and reranking runtime"
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch==2.14.1",
    "transformers==5.3.0",
    "peft==0.21.2",
    "bitsandbytes==0.50.2",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
    "numpy>=1.26",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.deptry.per_rule_ignores]
DEP002 = ["accelerate", "bitsandbytes"]
