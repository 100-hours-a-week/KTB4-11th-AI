[project]
name = "news-clusterer"
version = "0.1.0"
description = "Cron-triggered news clustering and summarization"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ktb-core",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.54",
    "psycopg[binary]>=3.3.6",
    "pgvector>=0.5.0",
    "httpx>=0.28",
    "numpy>=2.5",
]

[project.scripts]
news-clusterer = "news_clusterer.__main__:main"

[tool.uv.sources]
ktb-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
