source_roots = [
    "packages/core/src",
    "packages/market-analyzer/src",
    "services/market-syncer/src",
    "services/market-collector/src",
    "services/news-preprocessor/src",
    "services/news-clusterer/src",
    "services/news-graph-builder/src",
    "services/portfolio-builder/src",
    "services/portfolio-rebalancer/src",
]
root_module = "forbid"

[[modules]]
path = "ktb_core"

[[modules]]
path = "ktb_market_analyzer"

[[modules]]
path = "news_preprocessor"
depends_on = ["ktb_core"]

[[modules]]
path = "news_clusterer"
depends_on = ["ktb_core"]

[[modules]]
path = "news_graph_builder"
depends_on = [
    "ktb_core",
    "news_graph_builder.cluster",
    "news_graph_builder.graph",
]

[[modules]]
path = "news_graph_builder.database"
depends_on = []

[[modules]]
path = "news_graph_builder.cluster"
depends_on = ["news_graph_builder.database"]

[[modules]]
path = "news_graph_builder.graph"
depends_on = [
    "ktb_core",
    "news_graph_builder.database",
]

[[interfaces]]
expose = [".*"]
from = ["news_graph_builder.database"]

[[interfaces]]
expose = ["find_cluster_articles", "find_stale_clusters", "lock_cluster"]
from = ["news_graph_builder.cluster"]

[[interfaces]]
expose = [
    "Entity",
    "Extraction",
    "Relation",
    "extract",
    "has_corporations",
    "merge_company_entities",
    "resolve",
    "write_graph",
]
from = ["news_graph_builder.graph"]

[[modules]]
path = "portfolio_builder"
depends_on = ["ktb_core"]

[[modules]]
path = "market_syncer"
depends_on = ["ktb_core"]

[[modules]]
path = "market_collector"
depends_on = ["ktb_core"]

[[modules]]
path = "portfolio_rebalancer"
depends_on = ["ktb_core"]
