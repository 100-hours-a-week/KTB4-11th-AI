name: Deploy Archify

on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'OCI manifest digest (sha256: followed by 64 lowercase hex digits)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: archify-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate artifact digest
        env:
          ARTIFACT_DIGEST: ${{ inputs.digest }}
        run: |
          if [[ ! "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Expected an OCI manifest digest: sha256:<64 lowercase hex digits>."
            exit 1
          fi
      - uses: oras-project/setup-oras@v2.0.3
        with:
          version: 1.3.6
      - name: Download site from GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIGEST: ${{ inputs.digest }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras pull "ghcr.io/100-hours-a-week/archify-site@$ARTIFACT_DIGEST" \
            --output "$RUNNER_TEMP/archify-site"
      - name: Extract and verify site
        shell: python
        run: |
          import json
          import os
          import tarfile
          from pathlib import Path

          site = Path("_site")
          site.mkdir()
          archive = Path(os.environ["RUNNER_TEMP"]) / "archify-site/archify-site.tar.gz"
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              if any(not (member.isfile() or member.isdir()) for member in members):
                  raise ValueError("Site archive must contain only regular files and directories")
              bundle.extractall(site, members=members, filter="data")
          for name in ("index.html", "architecture.json"):
              path = site / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise ValueError(f"Missing or empty site file: {name}")
          json.loads((site / "architecture.json").read_text(encoding="utf-8"))
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Publish architecture to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
