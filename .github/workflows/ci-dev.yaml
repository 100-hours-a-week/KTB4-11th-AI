name: CI Dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

  pull_request:
    branches: [dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: ktb
          POSTGRES_PASSWORD: ktb
          POSTGRES_DB: ktb
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ktb -d ktb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      questdb:
        image: questdb/questdb:10.0.1
        ports:
          - "9000:9000"
        options: >-
          --health-cmd "curl -fsS http://localhost:9003/status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8.1.4
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      KTB_POSTGRES_DSN: postgresql+psycopg://ktb:ktb@localhost:5432/ktb
      KTB_TEST_POSTGRES_DSN: postgresql+psycopg://ktb:ktb@localhost:5432/ktb
      KTB_TEST_QUESTDB_CONF: ws::addr=localhost:9000;
      KTB_TEST_VALKEY_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --locked --group migrations

      - name: Ruff check
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Check module boundaries
        run: uv run tach check

      - name: Check core has no external dependencies
        run: |
          uv run python -c 'import pathlib, tomllib; assert not tomllib.loads(pathlib.Path("packages/core/pyproject.toml").read_text())["project"]["dependencies"]'
          uv run tach check-external -e services

      - name: Check report-builder isolated import
        run: uv run --isolated --package report-builder --locked --no-dev python -c 'import report_builder.__main__'

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked --group migrations
      - name: Inspect declared dependencies per workspace member
        continue-on-error: true
        run: |
          set -euo pipefail
          audit_status=0
          for member in packages/* services/*; do
            echo "::group::$member"
            uv run deptry "$member/src" --config "$member/pyproject.toml" || audit_status=1
            echo "::endgroup::"
          done
          exit "$audit_status"

  verify-exported-requirements:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Exported requirements still match uv.lock
        run: |
          set -euo pipefail
          for pkg in news-preprocessor news-clusterer market-syncer news-graph-builder news-http portfolio-builder market-collector market-streamer market-http portfolio-rebalancer report-builder; do
            uv export --package "$pkg" --no-dev --no-emit-workspace \
              --format requirements-txt -o "docker/requirements/${pkg}.txt" > /dev/null
          done
          uv export --all-packages --no-dev --group migrations --no-emit-workspace \
            --format requirements-txt -o docker/requirements/app.txt > /dev/null
          git diff --exit-code -- docker/requirements/

  build-images:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        service:
          - news-preprocessor
          - news-clusterer
          - market-syncer
          - news-graph-builder
          - news-http
          - portfolio-builder
          - market-collector
          - market-streamer
          - market-http
          - portfolio-rebalancer
          - report-builder

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-app-image:
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    needs: lint-and-test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push application image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ vars.PUBLIC_ECR_AI_REPOSITORY_URI }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Record release image
        if: github.event_name == 'push'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ vars.PUBLIC_ECR_AI_REPOSITORY_URI }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg sha "$GITHUB_SHA" --arg digest "$IMAGE_DIGEST" --arg repository "$IMAGE_REPOSITORY" \
            '{sha: $sha, digest: $digest, repository: $repository}' > ecs-release.json

      - name: Upload release image record
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ecs-release
          path: ecs-release.json
          retention-days: 90

  python-314-compatibility:
    runs-on: ubuntu-24.04
    continue-on-error: true

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: ktb
          POSTGRES_PASSWORD: ktb
          POSTGRES_DB: ktb
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ktb -d ktb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      KTB_POSTGRES_DSN: postgresql+psycopg://ktb:ktb@localhost:5432/ktb
      KTB_TEST_POSTGRES_DSN: postgresql+psycopg://ktb:ktb@localhost:5432/ktb

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked --group migrations --python 3.14
      - run: uv run --python 3.14 alembic upgrade head
      - run: uv run --python 3.14 pytest

  deploy-dev:
    needs: [lint-and-test, dependency-audit, verify-exported-requirements, build-images, build-app-image, python-314-compatibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    uses: ./.github/workflows/cd-dev.yaml
    with:
      image_tag: ${{ github.sha }}
      image_digest: ${{ needs.build-app-image.outputs.image_digest }}
    secrets: inherit

