name: CI Dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

  pull_request:
    branches: [dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --locked --group migrations

      - name: Ruff check
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Check module boundaries
        run: uv run tach check

      - name: Check core has no external dependencies
        run: |
          uv run python -c 'import pathlib, tomllib; assert not tomllib.loads(pathlib.Path("packages/core/pyproject.toml").read_text())["project"]["dependencies"]'
          uv run tach check-external -e packages/market-analyzer,services

      - name: Run tests
        run: uv run pytest

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked --group migrations
      - name: Inspect declared dependencies per workspace member
        continue-on-error: true
        run: |
          set -euo pipefail
          audit_status=0
          for member in packages/* services/*; do
            echo "::group::$member"
            uv run deptry "$member/src" --config "$member/pyproject.toml" || audit_status=1
            echo "::endgroup::"
          done
          exit "$audit_status"

  verify-exported-requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Exported requirements still match uv.lock
        run: |
          set -euo pipefail
          for pkg in news-preprocessor news-clusterer portfolio-builder; do
            uv export --package "$pkg" --no-dev --no-emit-workspace \
              --format requirements-txt -o "docker/requirements/${pkg}.txt" > /dev/null
          done
          git diff --exit-code -- docker/requirements/

  build-images:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - news-preprocessor
          - news-clusterer
          - portfolio-builder

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  python-314-compatibility:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked --group migrations --python 3.14
      - run: uv run --python 3.14 pytest
