name: CI Dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

  pull_request:
    branches: [dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ github.event_name == 'push' || steps.filter.outputs.shared == 'true' }}
      services: ${{ steps.targets.outputs.services }}
      members: ${{ steps.targets.outputs.members }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4.0.3
        with:
          list-files: json
          filters: |
            shared:
              - uv.lock
              - pyproject.toml
              - conftest.py
              - tach.toml
              - alembic.ini
              - .python-version
              - .dockerignore
              - infrastructure/**
              - .github/workflows/**
              - scripts/**
            members:
              - packages/**
              - services/**
              - docker/*.Dockerfile
              - docker/requirements/*.txt

      - uses: astral-sh/setup-uv@v10.2.0
        if: github.event_name == 'pull_request'

      - name: Export affected workspace members
        id: targets
        env:
          FULL: ${{ github.event_name == 'push' || steps.filter.outputs.shared == 'true' }}
          FILES: ${{ steps.filter.outputs.members_files }}
        run: |
          set -euo pipefail
          if [[ "$FULL" == true ]]; then
            members=$(printf '%s\n' packages/* services/*)
          else
            members=$(jq -r '.[] | split("/") | if .[0] == "docker" then "services/" + (.[-1] | sub("\\.(Dockerfile|txt)$"; "")) else .[:2] | join("/") end' <<< "$FILES")
            for member in $members; do
              if [[ -d "$member" ]]; then
                if [[ "$member" == packages/* ]]; then
                  package="ktb-${member#packages/}"
                else
                  package="${member#services/}"
                fi
                tree=$(uv tree --invert --frozen --universal --no-dev --package "$package")
                if [[ -z "$tree" ]]; then
                  echo "::error::$member is not the workspace package $package"
                  exit 1
                fi
                members+=$'\n'$(tail -n +2 <<< "$tree" \
                  | sed -E 's/^[^a-z]*//; s/ v[0-9].*//; /^ktb-/!s#^#services/#; s#^ktb-#packages/#')
              fi
            done
          fi
          members=$(sort -u <<< "$members" | while read -r member; do if [[ -d "$member" ]]; then echo "$member"; fi; done)
          echo "members=$(tr '\n' ' ' <<< "$members" | sed 's/ $//')" >> "$GITHUB_OUTPUT"
          services=$(while read -r member; do
            if [[ "$member" == services/* && -f "docker/${member#services/}.Dockerfile" ]]; then
              echo "${member#services/}"
            fi
          done <<< "$members" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "services=$services" >> "$GITHUB_OUTPUT"

  lint-and-test:
    needs: detect-changes
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: ktb
          POSTGRES_PASSWORD: ktb
          POSTGRES_DB: ktb
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ktb -d ktb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      questdb:
        image: questdb/questdb:10.2.0
        ports:
          - "9000:9000"
        options: >-
          --health-cmd "curl -fsS http://localhost:9003/status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8.1.4
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      KTB_POSTGRES_DSN: postgresql+psycopg://ktb:ktb@localhost:5432/ktb
      KTB_TEST_POSTGRES_DSN: postgresql+psycopg://ktb:ktb@localhost:5432/ktb
      KTB_TEST_QUESTDB_CONF: ws::addr=localhost:9000;
      KTB_TEST_VALKEY_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --locked --group migrations

      - name: Ruff check
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Check module boundaries
        run: uv run tach check

      - name: Check core has no external dependencies
        run: |
          uv run python -c 'import pathlib, tomllib; assert not tomllib.loads(pathlib.Path("packages/core/pyproject.toml").read_text())["project"]["dependencies"]'
          uv run tach check-external -e services

      - name: Check report-builder isolated import
        if: contains(fromJSON(needs.detect-changes.outputs.services), 'report-builder')
        run: uv run --isolated --package report-builder --locked --no-dev python -c 'import report_builder.__main__'

      - name: Apply database migrations
        if: needs.detect-changes.outputs.members != ''
        run: uv run alembic upgrade head

      - name: Run tests
        if: needs.detect-changes.outputs.members != ''
        env:
          FULL: ${{ needs.detect-changes.outputs.full }}
          MEMBERS: ${{ needs.detect-changes.outputs.members }}
        run: |
          if [[ "$FULL" == true ]]; then
            uv run pytest
          else
            uv run pytest $MEMBERS
          fi

  dependency-audit:
    needs: detect-changes
    if: needs.detect-changes.outputs.members != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked --group migrations
      - name: Inspect declared dependencies per workspace member
        continue-on-error: true
        env:
          MEMBERS: ${{ needs.detect-changes.outputs.members }}
        run: |
          set -euo pipefail
          audit_status=0
          for member in $MEMBERS; do
            echo "::group::$member"
            uv run deptry "$member/src" --config "$member/pyproject.toml" || audit_status=1
            echo "::endgroup::"
          done
          exit "$audit_status"

  verify-exported-requirements:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Exported requirements still match uv.lock
        run: |
          set -euo pipefail
          for pkg in disclosure-indexer news-preprocessor news-clusterer market-syncer news-graph-builder news-http portfolio-builder market-collector market-streamer market-http portfolio-rebalancer report-builder; do
            uv export --package "$pkg" --no-dev --no-emit-workspace \
              --format requirements-txt -o "docker/requirements/${pkg}.txt" > /dev/null
          done
          uv export --all-packages --no-dev --group migrations --no-emit-workspace \
            --format requirements-txt -o docker/requirements/app.txt > /dev/null
          git diff --exit-code -- docker/requirements/

  build-images:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '' && needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-app-image:
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    needs: lint-and-test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push application image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ vars.PUBLIC_ECR_AI_REPOSITORY_URI }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Record release image
        if: github.event_name == 'push'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ vars.PUBLIC_ECR_AI_REPOSITORY_URI }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg sha "$GITHUB_SHA" --arg digest "$IMAGE_DIGEST" --arg repository "$IMAGE_REPOSITORY" \
            '{sha: $sha, digest: $digest, repository: $repository}' > ecs-release.json

      - name: Upload release image record
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ecs-release
          path: ecs-release.json
          retention-days: 90

  python-315-compatibility:
    runs-on: ubuntu-24.04
    continue-on-error: true

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: ktb
          POSTGRES_PASSWORD: ktb
          POSTGRES_DB: ktb
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ktb -d ktb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      KTB_POSTGRES_DSN: postgresql+psycopg://ktb:ktb@localhost:5432/ktb
      KTB_TEST_POSTGRES_DSN: postgresql+psycopg://ktb:ktb@localhost:5432/ktb

    steps:
      - uses: actions/checkout@v7
        id: checkout
        continue-on-error: true
      - uses: astral-sh/setup-uv@v7
        id: setup
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        with:
          enable-cache: true
      - name: Install dependencies
        id: install
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: uv sync --all-packages --locked --group migrations --python 3.15
      - name: Apply database migrations
        id: migrate
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: uv run --python 3.15 alembic upgrade head
      - name: Run tests
        id: test
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        run: uv run --python 3.15 pytest
      - name: Summarize Python 3.15 compatibility
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP: ${{ steps.setup.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          if [[ "$TEST" == success ]]; then
            result=PASS
          elif [[ "$CHECKOUT" == failure || "$SETUP" == failure ]]; then
            result='NOT RUN (preparation failed)'
          elif [[ "$INSTALL" == failure || "$MIGRATE" == failure || "$TEST" == failure ]]; then
            result=FAIL
          else
            result='NOT RUN (incomplete)'
          fi
          {
            echo "### Python 3.15 compatibility: $result"
            echo "- Checkout: ${CHECKOUT:-skipped}"
            echo "- Setup uv: ${SETUP:-skipped}"
            echo "- Install dependencies: ${INSTALL:-skipped}"
            echo "- Apply migrations: ${MIGRATE:-skipped}"
            echo "- Run tests: ${TEST:-skipped}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$result" != PASS ]]; then
            echo "::warning::Python 3.15 compatibility: $result; see the job summary for step outcomes."
          fi

  deploy-dev:
    needs: [detect-changes, lint-and-test, dependency-audit, verify-exported-requirements, build-images, build-app-image, python-315-compatibility]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.build-app-image.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    permissions:
      contents: read
    uses: ./.github/workflows/cd-dev.yaml
    with:
      image_tag: ${{ github.sha }}
      image_digest: ${{ needs.build-app-image.outputs.image_digest }}
    secrets: inherit

