name: Temporary remove legacy market-syncer timer

on:
  pull_request:
    branches:
      - chore/313-market-syncer-daily

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.EC2_HOST }}
      DEPLOY_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Remove production legacy timer
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          if systemctl cat ktb-market-syncer.timer >/dev/null 2>&1; then
            sudo -n systemctl disable --now ktb-market-syncer.timer || true
          fi
          sudo -n rm -f /etc/systemd/system/ktb-market-syncer.timer
          sudo -n systemctl daemon-reload
          ! systemctl cat ktb-market-syncer.timer >/dev/null 2>&1
          echo "legacy market-syncer timer removed"
          REMOTE

  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: development
    env:
      DEPLOY_HOST: ${{ secrets.EC2_HOST }}
      DEPLOY_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Remove development legacy timer
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          if systemctl cat ktb-market-syncer.timer >/dev/null 2>&1; then
            sudo -n systemctl disable --now ktb-market-syncer.timer || true
          fi
          sudo -n rm -f /etc/systemd/system/ktb-market-syncer.timer
          sudo -n systemctl daemon-reload
          ! systemctl cat ktb-market-syncer.timer >/dev/null 2>&1
          echo "legacy market-syncer timer removed"
          REMOTE
