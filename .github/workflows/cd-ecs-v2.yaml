name: CD ECS V2

# dev 브랜치의 CI Dev가 성공하면, 그 커밋 이미지로 V2 운영 ECS의 market-http를 배포합니다.
# 나머지 AI 서비스는 cd-dev.yaml(개발 EC2)과 cd.yaml(운영 EC2)이 담당합니다.
on:
  workflow_run:
    workflows: ["CI Dev"]
    # workflow_run은 success 타입을 지원하지 않아 completed로 받은 뒤 job의 if에서 성공만 허용합니다.
    types: [completed]
    branches: [dev]
  # 재배포나 장 마감 후로 미룬 배포를 수동으로 실행합니다. dev 브랜치에서 실행해야 합니다.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC로 ECS 배포 Role을 assume

# 배포가 겹쳐 서로 덮어쓰지 않도록 순서대로 실행합니다.
concurrency:
  group: ecs-v2-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  CLUSTER: stockspoon-v2-prod-cluster
  # CI Dev가 push한 이미지입니다. (cd-dev.yaml과 같은 태그 규칙)
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE: ${{ vars.PUBLIC_ECR_AI_REPOSITORY_URI }}:${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  check:
    # push로 실행된 CI Dev가 성공했을 때, 또는 dev에서 수동 실행했을 때만 배포합니다.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.freshness.outputs.deploy }}
    steps:
      # 대기 중 dev가 갱신됐으면 과거 이미지를 뒤늦게 배포하지 않습니다.
      - name: Check deployment freshness
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_dev_sha="$(gh api "repos/${{ github.repository }}/commits/dev" --jq .sha)"
          test -n "$current_dev_sha" || { echo "Unable to resolve refs/heads/dev" >&2; exit 1; }

          if [[ "$DEPLOY_SHA" == "$current_dev_sha" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale deployment: target=$DEPLOY_SHA current=$current_dev_sha"
          fi

      - name: Verify successful CI for manual deployment
        if: github.event_name == 'workflow_dispatch' && steps.freshness.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="$(gh api --method GET \
            "repos/${{ github.repository }}/actions/workflows/ci-dev.yaml/runs" \
            -f branch=dev -f event=push -f head_sha="$DEPLOY_SHA" -f per_page=1 \
            --jq '.workflow_runs[0] // null')"

          if ! jq -e --arg sha "$DEPLOY_SHA" \
            '.head_sha == $sha and .head_branch == "dev" and .event == "push" and .status == "completed" and .conclusion == "success"' \
            <<<"$run" > /dev/null; then
            echo "::error::No successful completed CI Dev push run for $DEPLOY_SHA"
            exit 1
          fi
          echo "Verified CI: $(jq -r .html_url <<<"$run")"

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # V2 ECS에는 market-http(무중단 Rolling)만 있습니다. market-streamer는 ECS에서 운영하지 않습니다.
      max-parallel: 1
      fail-fast: true
      matrix:
        service: [market-http]
    steps:
      - name: Configure AWS credentials (ECS deploy)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Terraform이 관리하는 최신 Task Definition(환경 변수·Secret·리소스)에서 이미지만 바꿔 새 리비전을 등록합니다.
      - name: Register task definition with the new image
        id: taskdef
        env:
          FAMILY: stockspoon-v2-prod-${{ matrix.service }}
          CONTAINER: ${{ matrix.service }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query taskDefinition > current.json

          jq --arg image "$IMAGE" --arg name "$CONTAINER" '
            .containerDefinitions |= map(if .name == $name then .image = $image else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' current.json > next.json

          arn="$(aws ecs register-task-definition --cli-input-json file://next.json \
            --query taskDefinition.taskDefinitionArn --output text)"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "::notice::Registered $arn ($IMAGE)"

      # Circuit Breaker(rollback)가 켜져 있어 실패하면 ECS가 이전 리비전으로 되돌립니다.
      - name: Update service
        id: update
        env:
          SERVICE: stockspoon-v2-prod-${{ matrix.service }}
          TASK_DEFINITION: ${{ steps.taskdef.outputs.arn }}
        run: |
          set -euo pipefail
          response="$(aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$TASK_DEFINITION")"
          deployment_id="$(jq -r --arg arn "$TASK_DEFINITION" \
            '.service.deployments[] | select(.status == "PRIMARY" and .taskDefinition == $arn) | .id' \
            <<<"$response")"
          if [[ -z "$deployment_id" || "$deployment_id" == "null" ]]; then
            echo "::error::Could not find the new deployment for $TASK_DEFINITION"
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment completion
        env:
          SERVICE: stockspoon-v2-prod-${{ matrix.service }}
          TASK_DEFINITION: ${{ steps.taskdef.outputs.arn }}
          DEPLOYMENT_ID: ${{ steps.update.outputs.deployment_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 25 * 60))

          print_events() {
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].events[:10].[createdAt,message]' --output text || true
          }

          while (( SECONDS < deadline )); do
            response="$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE")"
            deployment="$(jq --arg id "$DEPLOYMENT_ID" \
              '[.services[0].deployments[]? | select(.id == $id)] | .[0] // null' \
              <<<"$response")"

            if ! jq -e --arg arn "$TASK_DEFINITION" \
              '. != null and .status == "PRIMARY" and .taskDefinition == $arn' \
              <<<"$deployment" > /dev/null; then
              echo "::error::Deployment $DEPLOYMENT_ID was rolled back, replaced or not returned"
              print_events
              exit 1
            fi

            state="$(jq -r .rolloutState <<<"$deployment")"
            echo "Deployment $DEPLOYMENT_ID: $state"
            case "$state" in
              COMPLETED)
                echo "Deployment completed: $TASK_DEFINITION"
                exit 0
                ;;
              FAILED)
                echo "::error::Deployment failed: $(jq -r .rolloutStateReason <<<"$deployment")"
                print_events
                exit 1
                ;;
              IN_PROGRESS) ;;
              *)
                echo "::error::Unexpected rollout state: $state"
                print_events
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "::error::Timed out waiting for deployment $DEPLOYMENT_ID"
          print_events
          exit 1
