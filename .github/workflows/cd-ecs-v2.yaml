name: AI V2 ECS CD

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      image_digest:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA from a successful main CI run (including older releases)
        required: true
        type: string

concurrency:
  group: ecs-production-market-http
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ECS_CLUSTER: stockspoon-v2-prod-cluster
      ECS_SERVICE: stockspoon-v2-prod-market-http
      TASK_FAMILY: stockspoon-v2-prod-market-http
      CONTAINER_NAME: market-http
      TASK_TEMPLATE: infrastructure/ecs/market-http.json
      POSTGRES_DSN_SECRET_ARN: ${{ vars.MARKET_HTTP_POSTGRES_DSN_SECRET_ARN }}
      IMAGE_REPOSITORY: ${{ vars.PUBLIC_ECR_AI_REPOSITORY_URI }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      CI_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      CI_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Validate deployment source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid commit SHA' >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Manual ECS deployments require main' >&2; exit 1; }
            ci_run="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci-main.yaml/runs" \
            -f branch=main -f event=push -f head_sha="$IMAGE_TAG" -f status=success -f per_page=1 \
            --jq '.workflow_runs[0] // null')"
            jq -e --arg sha "$IMAGE_TAG" \
            '.head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success"' \
            <<<"$ci_run" > /dev/null
            release_dir="$(mktemp -d)"
            trap 'rm -rf "$release_dir"' EXIT
            gh run download "$(jq -r .id <<<"$ci_run")" --repo "$GITHUB_REPOSITORY" \
            --name ecs-release --dir "$release_dir"
            jq -e --arg sha "$IMAGE_TAG" --arg repository "$IMAGE_REPOSITORY" \
            '.sha == $sha and .repository == $repository' "$release_dir/ecs-release.json" > /dev/null
            IMAGE_DIGEST="$(jq -r .digest "$release_dir/ecs-release.json")"
          else
            [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$CI_RUN_HEAD_BRANCH" == "main" && "$CI_RUN_CONCLUSION" == "success" ]] ||
              { echo 'Only successful main CI releases can deploy ECS' >&2; exit 1; }
            [[ "$IMAGE_TAG" == "$CI_RUN_HEAD_SHA" ]] ||
              { echo 'Source SHA does not match the main CI release' >&2; exit 1; }
            current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            [[ "$current_main_sha" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$IMAGE_TAG" != "$current_main_sha" ]]; then
              echo '::notice::Skipping stale automatic deployment'
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid image digest' >&2; exit 1; }
          echo "IMAGE=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.source.outputs.deploy == 'true'
        with:
          ref: ${{ inputs.image_tag }}
          persist-credentials: false

      - name: Verify task definition source
        if: steps.source.outputs.deploy == 'true'
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$IMAGE_TAG" ]]
          jq -e --arg family "$TASK_FAMILY" --arg name "$CONTAINER_NAME" \
            '.family == $family and ([.containerDefinitions[] | select(.name == $name)] | length) == 1' \
            "$TASK_TEMPLATE" > /dev/null

      - name: Configure AWS credentials with OIDC
        if: steps.source.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register task definition revision
        if: steps.source.outputs.deploy == 'true'
        id: register
        run: |
          set -Eeuo pipefail
          [[ -n "$POSTGRES_DSN_SECRET_ARN" ]] || { echo 'MARKET_HTTP_POSTGRES_DSN_SECRET_ARN is required' >&2; exit 1; }
          jq --arg name "$CONTAINER_NAME" --arg image "$IMAGE" --arg secret "$POSTGRES_DSN_SECRET_ARN" \
            '.containerDefinitions |= map(if .name == $name then .image = $image | .secrets = [{"name": "MARKET_HTTP_POSTGRES_DSN", "valueFrom": $secret}] else . end)' \
            "$TASK_TEMPLATE" > next.json
          arn="$(aws ecs register-task-definition --cli-input-json file://next.json \
            --query taskDefinition.taskDefinitionArn --output text)"
          [[ -n "$arn" && "$arn" != 'None' ]]
          echo "task_definition_arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        if: steps.source.outputs.deploy == 'true'
        id: update
        env:
          TASK_DEFINITION_ARN: ${{ steps.register.outputs.task_definition_arn }}
        run: |
          set -Eeuo pipefail
          response="$(aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN")"
          deployment_id="$(jq -r --arg arn "$TASK_DEFINITION_ARN" \
            '[.service.deployments[] | select(.status == "PRIMARY" and .taskDefinition == $arn)] | .[0].id // empty' \
            <<<"$response")"
          [[ -n "$deployment_id" ]] || { echo 'New deployment not found' >&2; exit 1; }
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment completion
        if: steps.source.outputs.deploy == 'true'
        env:
          DEPLOYMENT_ID: ${{ steps.update.outputs.deployment_id }}
          TASK_DEFINITION_ARN: ${{ steps.register.outputs.task_definition_arn }}
        run: |
          set -Eeuo pipefail
          deadline=$((SECONDS + 35 * 60))
          print_events() {
            aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].events[:10].[createdAt,message]' --output text || true
          }
          while (( SECONDS < deadline )); do
            response="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE")"
            deployment="$(jq --arg id "$DEPLOYMENT_ID" \
            '[.services[0].deployments[]? | select(.id == $id)] | .[0] // null' <<<"$response")"
            if ! jq -e --arg arn "$TASK_DEFINITION_ARN" \
            '. != null and .status == "PRIMARY" and .taskDefinition == $arn' <<<"$deployment" > /dev/null; then
              echo '::error::Deployment was rolled back, replaced or not returned'
              print_events
              exit 1
            fi
            state="$(jq -r .rolloutState <<<"$deployment")"
            echo "Deployment $DEPLOYMENT_ID: $state running=$(jq -r .runningCount <<<"$deployment")/$(jq -r .desiredCount <<<"$deployment") failed=$(jq -r .failedTasks <<<"$deployment")"
            case "$state" in
              COMPLETED) exit 0 ;;
              IN_PROGRESS) ;;
              *)
                echo "::error::Deployment failed: $(jq -r '.rolloutStateReason // .rolloutState' <<<"$deployment")"
                print_events
                exit 1
                ;;
            esac
            sleep 15
          done
          echo '::error::Timed out waiting for deployment'
          print_events
          exit 1

      - name: Add deployment summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          DEPLOY: ${{ steps.source.outputs.deploy }}
          TASK_DEFINITION_ARN: ${{ steps.register.outputs.task_definition_arn }}
          DEPLOYMENT_ID: ${{ steps.update.outputs.deployment_id }}
        run: |
          {
            echo '### V2 ECS deployment'
            echo "- commit: $IMAGE_TAG"
            echo "- image: ${IMAGE:-unresolved}"
            echo "- service: $ECS_CLUSTER/$ECS_SERVICE"
            echo "- task definition: $TASK_DEFINITION_ARN"
            echo "- deployment: $DEPLOYMENT_ID"
            if [[ "$DEPLOY" == 'false' ]]; then
              echo '- result: skipped (stale automatic deployment)'
            else
              echo "- result: $RESULT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
