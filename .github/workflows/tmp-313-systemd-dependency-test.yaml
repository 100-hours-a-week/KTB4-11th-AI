name: Temporary systemd dependency verification

on:
  pull_request:
    branches:
      - chore/313-market-syncer-daily

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required oneshot retry succeeds before consumer
        run: |
          set -euo pipefail
          sudo rm -f /tmp/ktb-sync-attempt /tmp/ktb-pipeline-started

          sudo tee /usr/local/bin/ktb-test-sync >/dev/null <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          n=0
          [[ -f /tmp/ktb-sync-attempt ]] && n="$(cat /tmp/ktb-sync-attempt)"
          n=$((n + 1))
          echo "$n" > /tmp/ktb-sync-attempt
          if (( n < 3 )); then
            exit 1
          fi
          SH
          sudo chmod +x /usr/local/bin/ktb-test-sync

          sudo tee /etc/systemd/system/ktb-test-sync.service >/dev/null <<'UNIT'
          [Unit]
          StartLimitIntervalSec=1h
          StartLimitBurst=3

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/ktb-test-sync
          Restart=on-failure
          RestartMode=direct
          RestartSec=1s
          UNIT

          sudo tee /etc/systemd/system/ktb-test-pipeline.service >/dev/null <<'UNIT'
          [Unit]
          Requires=ktb-test-sync.service
          After=ktb-test-sync.service

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/touch /tmp/ktb-pipeline-started
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl start ktb-test-pipeline.service

          test "$(cat /tmp/ktb-sync-attempt)" = "3"
          test -f /tmp/ktb-pipeline-started
          systemctl is-failed --quiet ktb-test-sync.service && exit 1 || true

      - name: Verify final sync failure blocks consumer
        run: |
          set -euo pipefail
          sudo systemctl reset-failed ktb-test-sync.service ktb-test-pipeline.service || true
          sudo rm -f /tmp/ktb-sync-attempt /tmp/ktb-pipeline-started

          sudo tee /usr/local/bin/ktb-test-sync >/dev/null <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          n=0
          [[ -f /tmp/ktb-sync-attempt ]] && n="$(cat /tmp/ktb-sync-attempt)"
          n=$((n + 1))
          echo "$n" > /tmp/ktb-sync-attempt
          exit 1
          SH
          sudo chmod +x /usr/local/bin/ktb-test-sync

          if sudo systemctl start ktb-test-pipeline.service; then
            echo "pipeline unexpectedly started" >&2
            exit 1
          fi

          test "$(cat /tmp/ktb-sync-attempt)" = "3"
          test ! -f /tmp/ktb-pipeline-started

      - name: Cleanup
        if: always()
        run: |
          sudo systemctl stop ktb-test-pipeline.service ktb-test-sync.service || true
          sudo rm -f /etc/systemd/system/ktb-test-pipeline.service
          sudo rm -f /etc/systemd/system/ktb-test-sync.service
          sudo rm -f /usr/local/bin/ktb-test-sync
          sudo systemctl daemon-reload
