name: Temporary EC2 Schedule Diagnostics

on:
  push:
    branches:
      - chore/313-ec2-diagnostics-temp

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.EC2_HOST }}
      DEPLOY_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Inspect production EC2 schedule
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "=== environment: production ==="
          echo "current_time=$(date --iso-8601=seconds)"
          echo "timezone=$(timedatectl show -p Timezone --value 2>/dev/null || true)"
          echo "boot_time=$(uptime -s 2>/dev/null || true)"
          echo
          echo "=== recent boots ==="
          sudo -n journalctl --list-boots --no-pager 2>/dev/null | tail -n 12 || true
          echo
          echo "=== relevant timers ==="
          systemctl list-timers --all --no-pager | grep -E 'ktb-(market-syncer|morning-pipeline|market-streamer|market-collector|news-preprocessor)' || true
          echo
          echo "=== morning pipeline timer ==="
          systemctl cat ktb-morning-pipeline.timer 2>/dev/null || true
          echo
          echo "=== market syncer timer ==="
          systemctl cat ktb-market-syncer.timer 2>/dev/null || true
          echo
          echo "=== timer properties ==="
          for unit in ktb-morning-pipeline.timer ktb-market-syncer.timer; do
            echo "--- $unit ---"
            systemctl show "$unit" -p ActiveState -p LastTriggerUSec -p NextElapseUSecRealtime -p UnitFileState 2>/dev/null || true
          done
          echo
          echo "=== recent morning pipeline starts ==="
          sudo -n journalctl -u ktb-morning-pipeline.service --since '14 days ago' --no-pager -o short-iso 2>/dev/null | grep -E 'Starting|Started|Finished|Failed|scheduled job|starting scheduled job' | tail -n 80 || true
          echo
          echo "=== recent market syncer starts ==="
          sudo -n journalctl -u ktb-market-syncer.service --since '14 days ago' --no-pager -o short-iso 2>/dev/null | grep -E 'Starting|Started|Finished|Failed|run_start|run_end|synced' | tail -n 120 || true
          REMOTE

  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: development
    env:
      DEPLOY_HOST: ${{ secrets.EC2_HOST }}
      DEPLOY_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Inspect development EC2 schedule
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "=== environment: development ==="
          echo "current_time=$(date --iso-8601=seconds)"
          echo "timezone=$(timedatectl show -p Timezone --value 2>/dev/null || true)"
          echo "boot_time=$(uptime -s 2>/dev/null || true)"
          echo
          echo "=== recent boots ==="
          sudo -n journalctl --list-boots --no-pager 2>/dev/null | tail -n 12 || true
          echo
          echo "=== relevant timers ==="
          systemctl list-timers --all --no-pager | grep -E 'ktb-(market-syncer|morning-pipeline|market-streamer|market-collector|news-preprocessor)' || true
          echo
          echo "=== morning pipeline timer ==="
          systemctl cat ktb-morning-pipeline.timer 2>/dev/null || true
          echo
          echo "=== market syncer timer ==="
          systemctl cat ktb-market-syncer.timer 2>/dev/null || true
          echo
          echo "=== timer properties ==="
          for unit in ktb-morning-pipeline.timer ktb-market-syncer.timer; do
            echo "--- $unit ---"
            systemctl show "$unit" -p ActiveState -p LastTriggerUSec -p NextElapseUSecRealtime -p UnitFileState 2>/dev/null || true
          done
          echo
          echo "=== recent morning pipeline starts ==="
          sudo -n journalctl -u ktb-morning-pipeline.service --since '14 days ago' --no-pager -o short-iso 2>/dev/null | grep -E 'Starting|Started|Finished|Failed|scheduled job|starting scheduled job' | tail -n 80 || true
          echo
          echo "=== recent market syncer starts ==="
          sudo -n journalctl -u ktb-market-syncer.service --since '14 days ago' --no-pager -o short-iso 2>/dev/null | grep -E 'Starting|Started|Finished|Failed|run_start|run_end|synced' | tail -n 120 || true
          REMOTE
